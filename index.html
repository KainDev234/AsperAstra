<!doctype html>
<!--
  AsperAstra – minimalistisches Weltraum-Aufbauspiel (Konzept: KONZEPT.md).

  Diese Datei enthält nur das Grundgerüst der Seite (feste UI-Elemente).
  Aussehen:  css/style.css
  Logik:     js/main.js und die davon importierten ES-Module (Übersicht in js/main.js)

  Die Module werden direkt vom Browser geladen (kein Build-Schritt). Deshalb muss die Seite über einen
  Webserver geöffnet werden (node server.js), nicht per Doppelklick.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Kein Browser-Zoom: Zoomen übernimmt die Karte selbst (zwei Finger). -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<!-- Erlaubt "Zum Startbildschirm hinzufügen" als Vollbild-App. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AsperAstra</title>
<link rel="stylesheet" href="css/style.css">
<!-- type="module" wird automatisch erst nach dem Aufbau der Seite ausgeführt. -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- Statusleiste: Spiel-Knopf, Datum, Zeitsteuerung mit Tempo-Schieberegler (feste Breiten). data-a = ui.act(). -->
<div id="top">
  <button id="btnGame" data-a="game" title="Spiel">≡</button>
  <b id="tYear"></b>
  <div id="speed">
    <button id="pause" data-a="speed:0" title="Pause">❚❚</button><button id="play" data-a="speed:1" title="Laufen">▶</button>
    <label id="tempoBox" title="Tempo: Spielzeit je Sekunde"><input id="tempo" type="range" min="0" max="7" step="1"><span id="tTempo"></span></label>
  </div>
</div>
<!-- Kopfzeile der Systemstufe (Lager, Energie bzw. Bericht) -->
<div id="head"></div>
<!-- Zoombare Karte (map.js), Gesten in input.js -->
<div id="map"></div>
<!-- Blatt von unten: Stern, Fronten oder Spiel -->
<div id="sheet"></div>
<!-- Feste Bedienleiste: liegt außerhalb jedes scrollenden Bereichs und bleibt immer an derselben Stelle -->
<div id="bar">
  <button data-a="out" title="Herauszoomen">−</button>
  <button data-a="front" title="Zur Front">◎</button>
  <button id="btnFronts" data-a="fronts" title="Fronten">☰</button>
</div>
<div id="toast"></div>
<!-- Unsichtbare Dateiauswahl für "Datei laden". -->
<input type="file" id="importFile" accept=".json,application/json" hidden>
</body>
</html>

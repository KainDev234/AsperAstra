<!doctype html>
<!--
  AsperAstra – minimalistisches Weltraum-Aufbauspiel (Konzept: KONZEPT.md).

  Diese Datei enthält nur das Grundgerüst der Seite (feste UI-Elemente).
  Aussehen:  css/style.css
  Logik:     js/main.js und die davon importierten ES-Module (Übersicht in js/main.js)

  Die Module werden direkt vom Browser geladen (kein Build-Schritt). Deshalb muss die Seite über einen
  Webserver geöffnet werden (node server.js), nicht per Doppelklick.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Kein Browser-Zoom: Zoomen übernimmt die Karte selbst (zwei Finger). -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<!-- Erlaubt "Zum Startbildschirm hinzufügen" als Vollbild-App. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AsperAstra</title>
<!--
  Versionsangaben gegen veraltete Dateien im Zwischenspeicher (#15): ?v= ist die Prüfsumme des Inhalts. Die
  Import-Map gilt auch für relative Importe zwischen den Modulen. Nicht von Hand pflegen: node tools/version.mjs
  (ein Test prüft, dass alles aktuell ist).
-->
<script type="importmap">{ "imports": { "./js/bot.js": "./js/bot.js?v=22410405", "./js/clock.js": "./js/clock.js?v=67071718", "./js/data.js": "./js/data.js?v=73f82104", "./js/galaxy.js": "./js/galaxy.js?v=5e757265", "./js/icons.js": "./js/icons.js?v=0a3f964b", "./js/input.js": "./js/input.js?v=d5e7f027", "./js/main.js": "./js/main.js?v=41fe1644", "./js/map.js": "./js/map.js?v=97e23531", "./js/ortui.js": "./js/ortui.js?v=d40e8a37", "./js/save.js": "./js/save.js?v=a2433260", "./js/scenarios.js": "./js/scenarios.js?v=258e0231", "./js/sim.js": "./js/sim.js?v=f5534893", "./js/state.js": "./js/state.js?v=d2f606ec", "./js/ui.js": "./js/ui.js?v=cfb906ec", "./js/util.js": "./js/util.js?v=6f9563dd", "./js/view.js": "./js/view.js?v=d631c97d" } }</script>
<link rel="stylesheet" href="css/style.css?v=40e2dc71">
<!-- type="module" wird automatisch erst nach dem Aufbau der Seite ausgeführt. -->
<script type="module" src="js/main.js?v=41fe1644"></script>
</head>
<body>
<!-- Statusleiste: Spiel-Knopf, Datum, Zeitsteuerung mit Tempo-Schieberegler (feste Breiten). data-a = ui.act(). -->
<div id="top">
  <button id="btnGame" data-a="game" title="Spiel">≡</button>
  <b id="tYear"></b>
  <div id="speed">
    <button id="pause" data-a="speed:0" title="Pause">❚❚</button><button id="play" data-a="speed:1" title="Laufen">▶</button>
    <label id="tempoBox" title="Tempo: Spielzeit je Sekunde"><input id="tempo" type="range" min="0" max="7" step="1"><span id="tTempo"></span></label>
  </div>
</div>
<!-- Kopfzeile der Systemstufe (Lager, Energie bzw. Bericht) -->
<div id="head"></div>
<!-- Zoombare Karte (map.js), Gesten in input.js -->
<div id="map"></div>
<!-- Blatt von unten: Stern, Fronten oder Spiel -->
<div id="sheet"></div>
<!-- Feste Bedienleiste: liegt außerhalb jedes scrollenden Bereichs und bleibt immer an derselben Stelle -->
<div id="bar">
  <button data-a="out" title="Herauszoomen">−</button>
  <button data-a="front" title="Zur Front">◎</button>
  <button id="btnFronts" data-a="fronts" title="Fronten">☰</button>
</div>
<div id="toast"></div>
<!-- Unsichtbare Dateiauswahl für "Datei laden". -->
<input type="file" id="importFile" accept=".json,application/json" hidden>
</body>
</html>
